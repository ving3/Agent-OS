apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: ai
  labels:
    app.kubernetes.io/part-of: hermes-agents
type: Opaque
stringData:
  BYTEDANCE_API_KEY: "CHANGE_ME_BYTEDANCE_API_KEY"
  WEBUI_SECRET_KEY: "CHANGE_ME_WEBUI_SECRET_KEY_32_CHARS_MIN"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  DATABASE_URL: "postgresql://openwebui:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/openwebui"
