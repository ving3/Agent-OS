---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-hermes-local
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes-agents
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-local
  local:
    path: /var/lib/ai/hermes
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - okdsnoapps
