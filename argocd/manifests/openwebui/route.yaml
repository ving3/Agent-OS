apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openwebui
  namespace: ai
  labels:
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: hermes-agents
spec:
  host: openwebui.apps.okdsnoapps.vmapps.home
  to:
    kind: Service
    name: openwebui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
