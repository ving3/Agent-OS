apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: ai
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: hermes-agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: hermes-agents
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000740000
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
          env:
            - name: HOME
              value: /home/node
            - name: N8N_USER_FOLDER
              value: /home/node/.n8n
            - name: N8N_HOST
              value: 0.0.0.0
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: http
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.apps.okdsnoapps.vmapps.home
            - name: WEBHOOK_URL
              value: https://n8n.apps.okdsnoapps.vmapps.home
            - name: GENERIC_TIMEZONE
              value: Europe/Paris
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_USER_MANAGEMENT_DISABLED
              value: "true"
            - name: N8N_METRICS
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
