---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: ai
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes-agents
spec:
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: api
      port: 8777
      targetPort: 8777
    - name: dashboard
      port: 9119
      targetPort: 9119
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes
  namespace: ai
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes-agents
spec:
  host: hermes.apps.okdsnoapps.vmapps.home
  to:
    kind: Service
    name: hermes
    weight: 100
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: ai
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes-agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          command:
            - /init
            - /opt/hermes/docker/main-wrapper.sh
            - gateway
            - run
          ports:
            - name: api
              containerPort: 8777
            - name: dashboard
              containerPort: 9119
          env:
            # --- Hermes HOME (volume persistant) ---
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # --- API Server (OpenAI-compatible, pour OpenWebUI) ---
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8777"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: WEBUI_SECRET_KEY
            # --- Dashboard ---
            - name: DASHBOARD_HOST
              value: 0.0.0.0
            - name: DASHBOARD_PORT
              value: "9119"
            # --- Fournisseur LLM : BytePlus ARK (OpenAI-compatible) ---
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: BYTEDANCE_API_KEY
            - name: OPENAI_BASE_URL
              value: https://ark.ap-southeast.bytepluses.com/api/coding/v3
            # --- Modele par defaut ---
            - name: HERMES_DEFAULT_MODEL
              value: deepseek-v4-pro-260425
            # --- Provider config (fichier inline) ---
            # Hermes lit ~/.hermes/config.yaml au demarrage.
            # On injecte la config via un fichier dans /opt/data/config.yaml
            # grace au script d'init ci-dessous.
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /opt/hermes-config
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8777
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8777
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: 8777
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
      initContainers:
        # Init container : seed la config Hermes dans le PVC
        - name: hermes-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              # Ne pas ecraser une config existante
              if [ -f /opt/data/config.yaml ]; then
                echo "[hermes-init] Config existante, pas d'ecrasement."
                exit 0
              fi
              echo "[hermes-init] Creation de la config initiale..."
              mkdir -p /opt/data
              cp /opt/hermes-config/config.yaml /opt/data/config.yaml
              cp /opt/hermes-config/SOUL.md /opt/data/SOUL.md 2>/dev/null || true
              echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > /opt/data/.env
              echo "OPENAI_BASE_URL=${OPENAI_BASE_URL}" >> /opt/data/.env
              echo "[hermes-init] Termine."
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: BYTEDANCE_API_KEY
            - name: OPENAI_BASE_URL
              value: https://ark.ap-southeast.bytepluses.com/api/coding/v3
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /opt/hermes-config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-config
          configMap:
            name: hermes-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes-agents
data:
  config.yaml: |
    # Hermes Agent - Configuration BytePlus ARK
    model:
      provider: openai
      default: deepseek-v4-pro-260425
      base_url: https://ark.ap-southeast.bytepluses.com/api/coding/v3

    api_server:
      enabled: true
      host: 0.0.0.0
      port: 8777

    dashboard:
      host: 0.0.0.0
      port: 9119

    terminal:
      backend: local

    memory:
      enabled: true

    skills:
      enabled: true
      auto_create: true

    cron:
      enabled: true

  SOUL.md: |
    # Hermes Agent - Personnalite

    Tu es Hermes, un agent IA autonome deploye sur OKD.
    Tu aides les utilisateurs avec leurs taches de developpement,
    d'infrastructure et d'automatisation.

    - Tu es precis, technique et utile.
    - Tu reponds en francais sauf demande contraire.
    - Tu expliques tes raisonnements.
    - Tu proposes des solutions concretes et actionnables.
