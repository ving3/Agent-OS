# ⚠️  DEPRECATED — Remplacé par argocd/manifests/agents-os/
# =============================================================================
# Ce fichier est conservé pour référence uniquement.
# Utiliser les manifests dans argocd/ pour tout nouveau déploiement.
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: agents-os
  namespace: ai
  labels:
    app.kubernetes.io/name: agents-os
spec:
  selector:
    app.kubernetes.io/name: agents-os
  ports:
    - name: http
      port: 8686
      targetPort: 8686
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agents-os
  namespace: ai
  labels:
    app.kubernetes.io/name: agents-os
spec:
  host: agents-os.apps.okdsnoapps.vmapps.home
  to:
    kind: Service
    name: agents-os
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-os
  namespace: ai
  labels:
    app.kubernetes.io/name: agents-os
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agents-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-os
    spec:
      serviceAccountName: agents-os
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
      containers:
        - name: agents-os
          image: image-registry.openshift-image-registry.svc:5000/ai/agents-os:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8686
          env:
            - name: HERMES_API_URL
              value: http://hermes:8777
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: WEBUI_SECRET_KEY
            - name: PROFILES_DIR
              value: /opt/data/profiles
            - name: SKILLS_DIR
              value: /opt/data/skills
            - name: HERMES_HOME
              value: /opt/data
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
              readOnly: true
            - name: agents-os-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
            readOnly: true
        - name: agents-os-data
          emptyDir: {}
