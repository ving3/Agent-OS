---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: ai
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes-agents
spec:
  storageClassName: ai-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
