---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-os-exec
  namespace: ai
  labels:
    app.kubernetes.io/name: agents-os
    app.kubernetes.io/part-of: hermes-agents
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-os-exec
  namespace: ai
  labels:
    app.kubernetes.io/name: agents-os
    app.kubernetes.io/part-of: hermes-agents
subjects:
  - kind: ServiceAccount
    name: agents-os
    namespace: ai
roleRef:
  kind: Role
  name: agents-os-exec
  apiGroup: rbac.authorization.k8s.io
