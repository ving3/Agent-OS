# =============================================================================
# TEMPLATE DE SECRET — NE PAS COMMITER AVEC DES VALEURS REELLES
# =============================================================================
# Ce fichier documente la structure du secret ai-secrets.
# Les vraies valeurs sont appliquees manuellement via :
#   oc apply -f docs/01-manifests/01-secrets.yaml
#
# ArgoCD ignore les differences sur ce secret (ignoreDifferences dans l'app).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: ai
  labels:
    app.kubernetes.io/part-of: hermes-agents
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "CHANGE_ME"
  N8N_ENCRYPTION_KEY: "CHANGE_ME_32_CHARS"
  N8N_API_KEY: "n8n_api_CHANGE_ME"
  WEBUI_SECRET_KEY: "CHANGE_ME_32_CHARS_MIN"
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://openwebui:CHANGE_ME@postgres:5432/openwebui"
