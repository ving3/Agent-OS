apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-manager
  namespace: ai
  labels:
    app.kubernetes.io/part-of: hermes-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: argocd-argocd-application-controller
    namespace: okd-gitops
  - kind: ServiceAccount
    name: argocd-argocd-server
    namespace: okd-gitops
