apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: agents-os
  namespace: ai
  labels:
    app.kubernetes.io/name: agents-os
    app.kubernetes.io/part-of: hermes-agents
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: agents-os:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi
